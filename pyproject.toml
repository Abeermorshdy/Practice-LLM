[project]
name = "practice-llm"
version = "0.1.0"
description = "Prctice LLM With OPs"
readme = "README.md"
requires-python =">=3.11.16,<3.12"
dependencies = [
    "flask>=3.1.3",
    "langchain==0.0.219",
    "pre-commit>=4.6.2",
]

[project.scripts]
practice-llm = "practice_llm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
